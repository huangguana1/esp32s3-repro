name: Build ESP32-S3 firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.1
        run: |
          set -e
          git clone --depth 1 --branch v5.5.1 https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          cd "$HOME/esp-idf"
          ./install.sh esp32s3

      - name: Build firmware
        run: |
          set +e
          . "$HOME/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE"
          idf.py set-target esp32s3 2>&1 | tee set_target.log
          idf.py build 2>&1 | tee build_output.log
          STATUS=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$STATUS"
          echo "$STATUS" > /tmp/build_status

          if [ "$STATUS" != "0" ]; then
            grep -iE "error:|fatal error|undefined reference|error ;|Error [0-9]|No rule to make|CMake Error|note: " build_output.log set_target.log 2>/dev/null | head -120 > BUILD_ERROR.txt || true
            tail -40 build_output.log >> BUILD_ERROR.txt
            git config user.email ci@local
            git config user.name CI
            git add -f BUILD_ERROR.txt
            git commit -m "build diagnostics [skip ci]" || true
            git push || true
            exit 1
          fi

      - name: Collect flashable binaries
        run: |
          set -e
          mkdir -p firmware
          cp build/bootloader/bootloader.bin firmware/ 2>/dev/null || true
          cp build/partition_table/partition-table.bin firmware/ 2>/dev/null || true
          cp build/*.bin firmware/ 2>/dev/null || true
          cp build/flasher_args.json firmware/ 2>/dev/null || true
          cp build/config/sdkconfig.h firmware/ 2>/dev/null || true
          echo "--- packaged files ---"
          ls -lh firmware/

      - name: Generate flash instructions
        run: |
          cat > firmware/README_FLASH.txt <<'EOF'
          ESP32-S3 1:1 functional port of risinek/esp32-wifi-penetration-tool
          Paper: "Wi-Fi attacks using ESP32", R. Stehlik, FIT VUTBR, 2021

          FLASH (esptool v4.7+ installed in the local web flasher):
            esptool.py --port <PORT> --baud 460800 write_flash @flash_args
          Run this from the firmware/ directory (flash_args lists offsets).

          Or use the local web flasher at http://127.0.0.1:8765

          USAGE (web UI - same as upstream project):
            1. Connect to WiFi "ManagementAP" (password: mgmtadmin)
            2. Open http://192.168.4.1 in a browser
            3. Scan APs, choose target, select attack type (HANDSHAKE / PMKID / DOS)
               and method (BROADCAST / ROGUE_AP / PASSIVE), set timeout, run.
            4. Poll /status; download /capture.hccapx and /capture.pcap.
          All upstream endpoints are preserved: /, /ap-list, /run-attack,
          /status, /reset, /capture.hccapx, /capture.pcap.
          LEGAL: authorised / own networks only.
          EOF

      - name: Commit firmware into repo (direct download fallback)
        run: |
          set +e
          git config user.email ci@local
          git config user.name CI
          git add -f firmware/
          git commit -m "firmware build [skip ci]" || true
          git push || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-repro-firmware
          path: firmware/
          retention-days: 30
