name: Build ESP32-S3 firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF (official action)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: '.'

      - name: Collect flashable binaries
        run: |
          set -e
          mkdir -p firmware
          cp build/bootloader/bootloader.bin firmware/ 2>/dev/null || true
          cp build/partition_table/partition-table.bin firmware/ 2>/dev/null || true
          cp build/*.bin firmware/ 2>/dev/null || true
          cp build/flasher_args.json firmware/ 2>/dev/null || true
          echo "--- packaged files ---"
          ls -lh firmware/

      - name: Generate flash instructions
        run: |
          cat > firmware/README_FLASH.txt <<'EOF'
          ESP32-S3 reproduction firmware - Path B rogue-AP deauth
          Flash (from firmware/ dir): esptool.py --port <PORT> write_flash @flash_args
          Or use local web flasher at http://127.0.0.1:8765
          LEGAL: authorised / own networks only.
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-repro-firmware
          path: firmware/
          retention-days: 30
